[project]
name = "oikonomos-backend"
version = "0.1.0"
description = "Oikonomos API, indexer and agent worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "web3>=7.0",
    "openai>=1.0",
    "apscheduler>=3.10",
    "numpy>=2.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions", "app/db/migrations/env.py"]

[tool.ruff.lint]
# B008: FastAPI's own Depends()-in-defaults idiom, not a real mutable-default bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["pandas.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs Docker (testcontainers Postgres); excluded from the fast unit run"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
