services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oikonomos
      POSTGRES_PASSWORD: oikonomos
      POSTGRES_DB: oikonomos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oikonomos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
